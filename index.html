<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ちぬのいけす</title>
  <meta name="description" content="チヌクエスト、ドッペル鬼ごっこ、資本主義の権化、海の回廊。ゲームを選んでスタート。">
  <meta name="theme-color" content="#081e2b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ちぬのいけす">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="canonical" href="https://saint-chinu.github.io/">
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="assets/css/launcher.css?v=1">
  <script src="assets/js/launcher.js?v=1" defer></script>
</head>
<body>
  <main class="launcher">
    <h1>ちぬのいけす</h1>
    <nav class="games" aria-label="ゲームを選ぶ">
      <a class="game chinu-quest" href="https://chinu-quest2-pvp.doppel-tag.workers.dev/" aria-label="チヌクエストを起動">
        <span class="icon"><img src="assets/launcher/chinu.png" alt="" width="156" height="156" decoding="async"></span>
        <span class="name">チヌクエスト</span>
      </a>
      <a class="game doppel-tag" href="https://doppel-tag.doppel-tag.workers.dev/" aria-label="ドッペル鬼ごっこを起動">
        <span class="icon"><img src="assets/launcher/doppel.png" alt="" width="156" height="156" decoding="async"></span>
        <span class="name">ドッペル鬼ごっこ</span>
      </a>
      <a class="game capitalism" href="https://que-finance-game.doppel-tag.workers.dev/" aria-label="資本主義の権化を起動">
        <span class="icon"><img src="assets/img/cast/que.webp" alt="" width="156" height="156" decoding="async"></span>
        <span class="name">資本主義の権化</span>
      </a>
      <a class="game umi-no-kairo" href="https://sea-corridor-basic.doppel-tag.workers.dev/" aria-label="海の回廊を起動">
        <span class="icon"><img src="assets/launcher/umi.png" alt="" width="156" height="156" decoding="async"></span>
        <span class="name">海の回廊</span>
      </a>
    </nav>
  </main>
</body>
</html>
